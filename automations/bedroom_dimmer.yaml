- id: dimmer_on_single
  alias: 'Dimmer: ON single press → turn on ambient light'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: on_short_release
  action:
  - service: light.turn_on
    target:
      entity_id: light.ambient_light_bed
- id: dimmer_off_single
  alias: 'Dimmer: OFF single press → turn off ambient light'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: off_short_release
  action:
  - service: light.turn_off
    target:
      entity_id: light.ambient_light_bed
- id: dimmer_on_double
  alias: 'Dimmer: ON double press → turn on bedroom lights'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: on_double_press
  action:
  - service: light.turn_on
    target:
      entity_id: light.bedroom_lights
- id: dimmer_off_double
  alias: 'Dimmer: OFF double press → turn off all bedroom lights'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: off_double_press
  action:
  - service: light.turn_off
    target:
      entity_id:
      - light.ambient_light_bed
      - light.bedroom_lights
- id: dimmer_on_long
  alias: 'Dimmer: ON long press → reset warm white full brightness'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: on_long_release
  action:
  - service: light.turn_on
    target:
      entity_id: light.bedroom_lights
    data:
      brightness_pct: 100
      color_temp_kelvin: 3000
- id: dimmer_up_single
  alias: 'Dimmer: BRIGHTER single press → increase brightness'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: up_short_release
  action:
  - service: light.turn_on
    target:
      entity_id: light.bedroom_lights
    data:
      brightness_step_pct: 10
- id: dimmer_up_double
  alias: 'Dimmer: BRIGHTER double press → cycle white temps'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: up_double_press
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.bedroom_white_index
    data:
      value: '{% set current = states(''input_number.bedroom_white_index'') | int
        %} {{ (current + 1) % 2 }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_white_index'') | int ==
          0 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          color_temp_kelvin: 3000
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_white_index'') | int ==
          1 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          color_temp_kelvin: 2200
- id: dimmer_down_single
  alias: 'Dimmer: DIMMER single press → decrease brightness'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: down_short_release
  action:
  - service: light.turn_on
    target:
      entity_id: light.bedroom_lights
    data:
      brightness_step_pct: -10
- id: dimmer_down_double
  alias: 'Dimmer: DIMMER double press → cycle colors'
  trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: a0aa2e5571d561ae6c80665ba3858435
      command: down_double_press
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.bedroom_color_index
    data:
      value: '{% set current = states(''input_number.bedroom_color_index'') | int
        %} {{ (current + 1) % 4 }}

        '
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_color_index'') | int ==
          0 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 255
          - 0
          - 0
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_color_index'') | int ==
          1 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 255
          - 105
          - 180
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_color_index'') | int ==
          2 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 0
          - 0
          - 255
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.bedroom_color_index'') | int ==
          3 }}'
      sequence:
      - service: light.turn_on
        target:
          entity_id: light.bedroom_lights
        data:
          rgb_color:
          - 0
          - 200
          - 0

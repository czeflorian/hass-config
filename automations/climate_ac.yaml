# ---- Night AC routine -------------------------------------------------------
# Script: packages/climate_ac.yaml → script.goodnight_ac
# Helpers: input_number.ac_night_pulldown_temp / ac_night_hold_temp
#          input_datetime.ac_night_off_time
# Button trigger: automations/remote_bilresa.yaml → ac_night_start

# Morning off — shut down AC and restore silent-mode switch to default off
- id: ac_night_morning_off
  alias: "AC night — morning off"
  triggers:
    - trigger: time
      at: input_datetime.ac_night_off_time
  actions:
    - action: climate.set_hvac_mode
      target: {entity_id: climate.living_room_klima}
      data: {hvac_mode: "off"}
    - action: switch.turn_off
      target: {entity_id: switch.living_room_klima_outdoor_silent_mode}

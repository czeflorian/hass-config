# ---- BILRESA Living Room remote ---------------------------------------------
# The BILRESA exposes events via `event.*` entities. We trigger on state
# changes (each press updates the entity's timestamp) and filter by the
# `event_type` attribute. Event types:
#   multi_press_1  → single press
#   multi_press_2  → double press
#   long_press     → button held (fires on press)
#   long_release   → held button released

- id: bilresa_lr_button_1_single
  alias: BILRESA LR — Button 1 (bottom, bigger) single press → toggle living room lights
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bilresa_living_room_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_1' }}"
  actions:
    - action: light.toggle
      target:
        entity_id: light.living_room_lights

- id: bilresa_lr_button_2_single
  alias: "BILRESA LR — Button 2 (top) single press → TV mode"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bilresa_living_room_button_2
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_1' }}"
  actions:
    - action: media_player.turn_on
      target:
        entity_id: media_player.tv_samsung_q7_series_55
    - action: script.movie_mode

- id: bilresa_lr_button_2_double
  alias: "BILRESA LR — Button 2 (top) double press → revert movie mode lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bilresa_living_room_button_2
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_2' }}"
  actions:
    - action: light.turn_on
      target:
        entity_id:
          - light.living_room_lights
          - light.floor_lamp
      data:
        brightness_pct: 100
        color_temp_kelvin: 3000
        transition: 2

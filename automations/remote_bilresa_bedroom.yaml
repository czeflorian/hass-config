# ---- BILRESA Bedroom scroll wheel --------------------------------------------
# Matter device exposing 9 event entities as 3 channels of 3 endpoints each
# (press / clockwise / counter-clockwise). Only channel 1 was confirmed live
# by direct testing:
#   event.bedroom_bilresa_bedroom_button_1 → clockwise scroll tick
#   event.bedroom_bilresa_bedroom_button_2 → counter-clockwise scroll tick
#   event.bedroom_bilresa_bedroom_button_3 → center press (supports
#                                             multi_press_1/2/3, long_press,
#                                             long_release)
# Channels 2 and 3 (buttons 4-9) are unused — likely redundant/failover
# endpoints from the same physical controls.
#
# Note on scrolling: Matter only reports a batched multi_press_N once you
# stop turning the wheel (N = ticks in that motion), not a live event per
# tick. The scroll automations below match any multi_press_N and scale the
# brightness step by N (5% per tick) so a longer spin moves brightness
# further in one go, instead of only reacting to single (N=1) ticks.

- id: bilresa_bedroom_press_single
  alias: "BILRESA Bedroom — center press single → toggle bedroom lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bedroom_bilresa_bedroom_button_3
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_1' }}"
  actions:
    - action: light.toggle
      target:
        entity_id: light.bedroom_lights

- id: bilresa_bedroom_press_double
  alias: "BILRESA Bedroom — center press double → toggle ambience"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bedroom_bilresa_bedroom_button_3
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'multi_press_2' }}"
  actions:
    - action: light.toggle
      target:
        entity_id: light.ambient_light_bed

- id: bilresa_bedroom_press_long
  alias: "BILRESA Bedroom — center press held → toggle bedroom lights + ambience together"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bedroom_bilresa_bedroom_button_3
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'long_press' }}"
  actions:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: light.bedroom_lights
                  state: "on"
                - condition: state
                  entity_id: light.ambient_light_bed
                  state: "on"
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom_lights
                  - light.ambient_light_bed
      default:
        - action: light.turn_on
          target:
            entity_id:
              - light.bedroom_lights
              - light.ambient_light_bed

- id: bilresa_bedroom_scroll_cw
  alias: "BILRESA Bedroom — scroll clockwise → brighten active bedroom lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bedroom_bilresa_bedroom_button_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type is match('multi_press_[0-9]+$') }}"
  actions:
    - variables:
        ticks: "{{ trigger.to_state.attributes.event_type.split('_')[-1] | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ 5 * ticks }}"

- id: bilresa_bedroom_scroll_ccw
  alias: "BILRESA Bedroom — scroll counter-clockwise → dim active bedroom lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.bedroom_bilresa_bedroom_button_2
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type is match('multi_press_[0-9]+$') }}"
  actions:
    - variables:
        ticks: "{{ trigger.to_state.attributes.event_type.split('_')[-1] | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ -5 * ticks }}"

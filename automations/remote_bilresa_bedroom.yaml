# ---- BILRESA Bedroom scroll wheel (via ha-ikea-bilresa HACS integration) ----
# Home Assistant's built-in Matter integration only reports one batched
# multi_press_N event after you stop scrolling, so real scrolling (N>1) felt
# laggy/dead. The community `Vituhlos/ha-ikea-bilresa` custom integration
# (https://github.com/Vituhlos/ha-ikea-bilresa) listens to the device's raw
# MultiPressOngoing stream directly, giving live per-notch events while
# scrolling — used here instead of the core Matter event.* entities.
#
# The wheel has a physical 3-position channel selector; ours is fixed on
# channel 1 (channels 2/3 are unused). Event types on that channel: press,
# double_press, triple_press, hold, release, rotate_up, rotate_down (with a
# `notches` count).
#
# IMPORTANT: triggers use a plain `state` trigger + a template condition on
# event_type, NOT an `attribute:`-scoped state trigger. An attribute-scoped
# trigger only fires when that attribute's VALUE changes — so two
# consecutive same-direction scrolls (event_type repeats, e.g. rotate_down
# then rotate_down again) would silently not fire a second time, even
# though a new event genuinely happened. The plain state trigger fires on
# every event because the entity's underlying state (a timestamp) always
# changes.
#
# Note: entity_id below keeps its original "living_room" prefix from when
# the device was first set up under the wrong area in this integration — the
# device itself has since been reassigned to the bedroom area, but renaming
# would change the entity_id and break this file, so it's left as-is.
#
# Even with the trigger fixed, the wheel's firmware itself has a built-in
# ~500ms-1s anti-flood delay between notch batches (documented by the
# integration author) — this gets close to smooth but isn't truly
# analog-continuous, and that residual delay can't be removed in software.

- id: bilresa_bedroom_press_single
  alias: "BILRESA Bedroom — center press single → toggle bedroom lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'press' }}"
  actions:
    - action: light.toggle
      target:
        entity_id: light.bedroom_lights

- id: bilresa_bedroom_press_double
  alias: "BILRESA Bedroom — center press double → toggle ambience"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'double_press' }}"
  actions:
    - action: light.toggle
      target:
        entity_id: light.ambient_light_bed

- id: bilresa_bedroom_press_hold
  alias: "BILRESA Bedroom — center press held → toggle bedroom lights + ambience together"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'hold' }}"
  actions:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: light.bedroom_lights
                  state: "on"
                - condition: state
                  entity_id: light.ambient_light_bed
                  state: "on"
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom_lights
                  - light.ambient_light_bed
      default:
        - action: light.turn_on
          target:
            entity_id:
              - light.bedroom_lights
              - light.ambient_light_bed

- id: bilresa_bedroom_scroll_up
  alias: "BILRESA Bedroom — scroll up → brighten active bedroom lights"
  description: ""
  mode: parallel
  max: 20
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'rotate_up' }}"
  actions:
    - variables:
        notches: "{{ trigger.to_state.attributes.notches | default(1) | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ 5 * notches }}"
        transition: 1

- id: bilresa_bedroom_scroll_down
  alias: "BILRESA Bedroom — scroll down → dim active bedroom lights"
  description: ""
  mode: parallel
  max: 20
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
  conditions:
    - condition: template
      value_template: "{{ trigger.to_state.attributes.event_type == 'rotate_down' }}"
  actions:
    - variables:
        notches: "{{ trigger.to_state.attributes.notches | default(1) | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ -5 * notches }}"
        transition: 1

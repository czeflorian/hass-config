# ---- BILRESA Bedroom scroll wheel (via ha-ikea-bilresa HACS integration) ----
# Home Assistant's built-in Matter integration only reports one batched
# multi_press_N event after you stop scrolling, so real scrolling (N>1) felt
# laggy/dead. The community `Vituhlos/ha-ikea-bilresa` custom integration
# (https://github.com/Vituhlos/ha-ikea-bilresa) listens to the device's raw
# MultiPressOngoing stream directly, giving live per-notch events while
# scrolling — used here instead of the core Matter event.* entities.
#
# The wheel has a physical 3-position channel selector; ours is fixed on
# channel 1 (channels 2/3 are unused). Event types on that channel: press,
# double_press, triple_press, hold, release, rotate_up, rotate_down (with a
# `notches` count).
#
# Note: entity_id below keeps its original "living_room" prefix from when
# the device was first set up under the wrong area in this integration — the
# device itself has since been reassigned to the bedroom area, but renaming
# would change the entity_id and break this file, so it's left as-is.

- id: bilresa_bedroom_press_single
  alias: "BILRESA Bedroom — center press single → toggle bedroom lights"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
      attribute: event_type
      to: press
  actions:
    - action: light.toggle
      target:
        entity_id: light.bedroom_lights

- id: bilresa_bedroom_press_double
  alias: "BILRESA Bedroom — center press double → toggle ambience"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
      attribute: event_type
      to: double_press
  actions:
    - action: light.toggle
      target:
        entity_id: light.ambient_light_bed

- id: bilresa_bedroom_press_hold
  alias: "BILRESA Bedroom — center press held → toggle bedroom lights + ambience together"
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
      attribute: event_type
      to: hold
  actions:
    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: light.bedroom_lights
                  state: "on"
                - condition: state
                  entity_id: light.ambient_light_bed
                  state: "on"
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.bedroom_lights
                  - light.ambient_light_bed
      default:
        - action: light.turn_on
          target:
            entity_id:
              - light.bedroom_lights
              - light.ambient_light_bed

- id: bilresa_bedroom_scroll_up
  alias: "BILRESA Bedroom — scroll up → brighten active bedroom lights"
  description: ""
  mode: parallel
  max: 20
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
      attribute: event_type
      to: rotate_up
  actions:
    - variables:
        notches: "{{ trigger.to_state.attributes.notches | default(1) | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ 5 * notches }}"
        transition: 1

- id: bilresa_bedroom_scroll_down
  alias: "BILRESA Bedroom — scroll down → dim active bedroom lights"
  description: ""
  mode: parallel
  max: 20
  triggers:
    - trigger: state
      entity_id: event.living_room_bilresa_living_room_channel_1
      attribute: event_type
      to: rotate_down
  actions:
    - variables:
        notches: "{{ trigger.to_state.attributes.notches | default(1) | int }}"
    - action: light.turn_on
      target:
        entity_id: >-
          {{ ['light.bedroom_lights', 'light.ambient_light_bed']
             | select('is_state', 'on') | list }}
      data:
        brightness_step_pct: "{{ -5 * notches }}"
        transition: 1

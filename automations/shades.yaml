# =============================================================================
#  Shade automations
#
#  Logic:
#    - Close shades when outside-temp > inside-temp AND sunshine is high AND
#      sun is up AND we're more than 1h before sunset.
#    - Wind safety: if gusts exceed threshold, retract everything and lock
#      out the close-automation until gusts have stayed below threshold for
#      the configured release delay.
#    - Manual override: if user moves a cover and our automation isn't
#      currently moving them, set the override flag and don't touch shades
#      again until 09:30.
#
#  We avoid the fragile context.parent_id pattern (broken in HA 2025.7+)
#  and use an explicit "automation is moving" flag instead. Any close/open
#  action sets the flag, waits for the cover to settle, clears the flag.
#  Manual detection only fires when the flag is off.
# =============================================================================

# ---- Close: Living Room -----------------------------------------------------
- id: shade_auto_close_living_room
  alias: Shades — close Living Room when conditions met
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.shade_close_conditions_living_room
      to: "on"
      for:
        minutes: 2
  conditions:
    - condition: state
      entity_id: input_boolean.shades_automation_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.shades_manual_override_living_room
      state: "off"
    - condition: state
      entity_id: input_boolean.shades_wind_lockout
      state: "off"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_automation_moving
    - action: cover.close_cover
      target:
        entity_id: cover.living_room_left
    - delay: "00:00:02"
    - action: cover.close_cover
      target:
        entity_id: cover.living_room_right
    - wait_template: "{{ is_state('cover.living_room_left', 'closed') and is_state('cover.living_room_right', 'closed') }}"
      timeout: "00:02:00"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shades_automation_moving

# ---- Close: Bedroom ---------------------------------------------------------
- id: shade_auto_close_bedroom
  alias: Shades — close Bedroom when conditions met
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.shade_close_conditions_bedroom
      to: "on"
      for:
        minutes: 2
  conditions:
    - condition: state
      entity_id: input_boolean.shades_automation_enabled
      state: "on"
    - condition: state
      entity_id: input_boolean.shades_manual_override_bedroom
      state: "off"
    - condition: state
      entity_id: input_boolean.shades_wind_lockout
      state: "off"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_automation_moving
    - action: cover.close_cover
      target:
        entity_id: cover.bedroom
    - wait_template: "{{ is_state('cover.bedroom', 'closed') }}"
      timeout: "00:02:00"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shades_automation_moving

# ---- Wind safety: open all and engage lockout -------------------------------
- id: shade_auto_wind_open_all
  alias: Shades — wind gust → open all and lock out
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.wind_gust_above_threshold
      to: "on"
  actions:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_wind_lockout
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_automation_moving
    - action: cover.open_cover
      target:
        entity_id: cover.living_room_left
    - delay: "00:00:02"
    - action: cover.open_cover
      target:
        entity_id: cover.living_room_right
    - delay: "00:00:02"
    - action: cover.open_cover
      target:
        entity_id: cover.bedroom
    - wait_template: "{{ is_state('cover.living_room_left', 'open') and is_state('cover.living_room_right', 'open') and is_state('cover.bedroom', 'open') }}"
      timeout: "00:02:00"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shades_automation_moving
    - action: persistent_notification.create
      data:
        title: Shades retracted (wind)
        message: >
          Wind gusts exceeded threshold ({{ states('sensor.wien_donaufeld_top_wind_speed') }} km/h).
          All shades opened. Auto-close suspended until wind has stayed below
          threshold for {{ states('input_number.shade_automation_wind_release_minutes') | int }} minutes.

# ---- Wind safety: release lockout when wind has been calm long enough -------
- id: shade_auto_wind_release_lockout
  alias: Shades — release wind lockout when calm
  description: ""
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ is_state('binary_sensor.wind_gust_above_threshold', 'off') }}
      for:
        minutes: "{{ states('input_number.shade_automation_wind_release_minutes') | int(15) }}"
  conditions:
    - condition: state
      entity_id: input_boolean.shades_wind_lockout
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.shades_wind_lockout
    - action: persistent_notification.create
      data:
        title: Shade automation re-enabled
        message: Wind has been calm. Auto-close is active again.

# ---- Manual override detection: Living Room --------------------------------
# Fires when either living room cover changes state. If our automation
# isn't currently moving them (the moving flag is off), treat as manual.
- id: shade_auto_detect_manual_living_room
  alias: Shades — detect manual override (Living Room)
  description: ""
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - cover.living_room_left
        - cover.living_room_right
  conditions:
    - condition: state
      entity_id: input_boolean.shades_automation_moving
      state: "off"
  actions:
    - delay: "00:00:05"  # debounce to avoid false triggers
    - condition: state
      entity_id: input_boolean.shades_automation_moving
      state: "off"  # recheck after delay
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_manual_override_living_room

# ---- Manual override detection: Bedroom -------------------------------------
- id: shade_auto_detect_manual_bedroom
  alias: Shades — detect manual override (Bedroom)
  description: ""
  mode: single
  triggers:
    - trigger: state
      entity_id: cover.bedroom
  conditions:
    - condition: state
      entity_id: input_boolean.shades_automation_moving
      state: "off"
  actions:
    - delay: "00:00:05"  # debounce to avoid false triggers
    - condition: state
      entity_id: input_boolean.shades_automation_moving
      state: "off"  # recheck after delay
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.shades_manual_override_bedroom

# ---- Daily reset: clear manual overrides at 09:30 ---------------------------
- id: shade_auto_reset_manual_overrides
  alias: Shades — reset manual overrides at 09:30
  description: ""
  mode: single
  triggers:
    - trigger: time
      at: "09:30:00"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.shades_manual_override_living_room
          - input_boolean.shades_manual_override_bedroom

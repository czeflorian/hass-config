# ---- Washing machine — remote control keep-alive ----------------------------
# Homewhiz remote control sessions time out after ~10 minutes of inactivity.
# Set state to "paused" every 5 minutes while on standby — the machine beeps
# and immediately reverts to "on" (since it's not running), confirming the
# command reached the device and resetting the session timeout.
- id: washing_machine_keepalive
  alias: "Washing Machine — remote control keep-alive"
  triggers:
    - trigger: time_pattern
      minutes: "/5"
  conditions:
    - condition: state
      entity_id: select.waschemasche_state
      state: "device_state_on"
  actions:
    - action: select.select_option
      target:
        entity_id: select.waschemasche_state
      data:
        option: "device_state_paused"

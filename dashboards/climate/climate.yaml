# =============================================================================
#  Climate Dashboard — AC + Blinds
#
#  Layout: 2 columns, 3 sections
#    Row 1 left:  AC status context (temps, power)
#    Row 1 right: AC controls (climate card, night routine)
#    Row 2 full:  Blinds (outdoor context, position, resume)
# =============================================================================

decluttering_templates: !include ../home/decluttering_templates.yaml

title: Climate
views:
  - title: Climate
    path: climate
    icon: mdi:thermometer
    type: sections
    max_columns: 2
    sections:

      # ---- AC — context (left column) -----------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: custom:decluttering-card
            template: section_title
            variables:
              - title: Air Conditioning

          # Temperatures
          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.living_room_klima_indoor_temperature
                  - label: AC Sensor
                  - icon: mdi:thermometer
                  - unit: " °C"
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.alpstuga_living_room_temperature
                  - label: Room Temp
                  - icon: mdi:home-thermometer
                  - unit: " °C"

          # Power consumption this session
          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.grillplats_plug_power
                  - label: AC Power
                  - icon: mdi:flash
                  - unit: " W"
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.ac_session_energy
                  - label: This Session
                  - icon: mdi:lightning-bolt
                  - unit: " kWh"

      # ---- AC — controls (right column) ---------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: custom:decluttering-card
            template: section_title
            variables:
              - title: Controls

          # Compact single-row — matches laundry Power card width behaviour.
          # collapsible_controls: true keeps it one row; tap for full more-info.
          - type: custom:mushroom-climate-card
            entity: climate.living_room_klima
            name: Living Room AC
            show_temperature_control: true
            hvac_modes:
              - "off"
              - cool
              - heat
              - dry
              - fan_only
              - auto
            collapsible_controls: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          # Different card types (toggle vs select) → each standalone, like laundry
          - type: custom:mushroom-entity-card
            entity: switch.living_room_klima_outdoor_silent_mode
            name: Silent Mode
            icon: mdi:volume-off
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          - type: custom:mushroom-select-card
            entity: select.living_room_klima_rate_select
            name: Power Gear
            icon: mdi:speedometer
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          # Night routine
          - type: custom:decluttering-card
            template: subsection_title
            variables:
              - title: Night Routine
          - type: horizontal-stack
            cards:
            - type: custom:mushroom-template-card
              primary: Goodnight
              secondary: >
                {% if is_state('script.goodnight_ac', 'on') %} Running…
                {% else %} Cool then quiet hold
                {% endif %}
              icon: mdi:power-sleep
              icon_color: >
                {% if is_state('script.goodnight_ac', 'on') %} var(--info-color)
                {% else %} var(--primary-color)
                {% endif %}
              tap_action:
                action: call-service
                service: script.goodnight_ac
              card_mod:
                style: |
                  ha-card {
                    background: var(--card-background-color);
                    border-radius: 20px;
                    border: 1px solid var(--divider-color);
                  }
            - type: custom:mushroom-entity-card
              entity: input_datetime.ac_night_off_time
              name: Morning off time
              icon: mdi:alarm
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    background: var(--card-background-color);
                    border-radius: 20px;
                    border: 1px solid var(--divider-color);
                  }

          # Temperature targets — buttons mode matches mushroom card height/style
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-number-card
                entity: input_number.ac_night_pulldown_temp
                name: Pull-down
                display_mode: buttons
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }
              - type: custom:mushroom-number-card
                entity: input_number.ac_night_hold_temp
                name: Hold
                display_mode: buttons
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }

      # ---- Blinds (full width) ------------------------------------------------
      - type: grid
        column_span: 2
        cards:
          - type: custom:decluttering-card
            template: section_title
            variables:
              - title: Blinds

          # Outdoor conditions — what the blind automation responds to
          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: status_tile
                variables:
                  - entity: sensor.wien_donaufeld_global_radiation
                  - status_entity: sensor.solar_status
                  - label: Solar
                  - icon: mdi:white-balance-sunny
                  - unit: " W/m²"
              - type: custom:decluttering-card
                template: status_tile
                variables:
                  - entity: sensor.wien_donaufeld_top_wind_speed
                  - status_entity: sensor.wind_status
                  - label: Wind
                  - icon: mdi:weather-windy
                  - unit: " km/h"
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.wien_donaufeld_temperature
                  - label: Outside
                  - icon: mdi:thermometer
                  - unit: " °C"

          # Cover positions + controls
          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: cover_tile
                variables:
                  - entity: cover.bedroom
                  - name: Bedroom
              - type: custom:decluttering-card
                template: cover_tile
                variables:
                  - entity: cover.living_room_left
                  - name: LR Left
              - type: custom:decluttering-card
                template: cover_tile
                variables:
                  - entity: cover.living_room_right
                  - name: LR Right

          # Standalone card = full width on mobile
          - type: custom:mushroom-template-card
            primary: Resume Auto
            secondary: "{{ states('sensor.shade_override_summary') }}"
            icon: mdi:autorenew
            icon_color: >
              {% if is_state('sensor.shade_override_active', 'moderate') %}
                var(--warning-color)
              {% else %}
                var(--success-color)
              {% endif %}
            tap_action:
              action: call-service
              service: script.resume_auto_blinds
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

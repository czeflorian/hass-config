# =============================================================================
#  Section: Energy + Appliances + Devices + Shade Automation
#
#  All coloring logic lives in template sensors (see packages/). Each sensor
#  emits a status string the dashboard maps to a color via the standard
#  status_tile / status_tile_attr / status_tile_text decluttering templates.
# =============================================================================

type: grid
column_span: 1
cards:
  # ---- Running now (AC or grill active) ----
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity: climate.living_room_klima
                state_not: "off"
              - condition: state
                entity: climate.living_room_klima
                state_not: "unavailable"
          - condition: state
            entity: switch.grillplats_plug
            state: "on"
    card:
      type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: section_title
          variables:
            - title: Running Now
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              primary: AC
              secondary: >
                {% set mode = states('climate.living_room_klima') %}
                {% set action = state_attr('climate.living_room_klima', 'hvac_action') %}
                {% set target = state_attr('climate.living_room_klima', 'temperature') %}
                {% if mode in ['off', 'unavailable'] %} Off
                {% else %} {{ action | title }} · {{ target }}°C
                {% endif %}
              icon: mdi:air-conditioner
              icon_color: >
                {% set mode = states('climate.living_room_klima') %}
                {% set action = state_attr('climate.living_room_klima', 'hvac_action') %}
                {% if mode in ['off', 'unavailable'] %} var(--disabled-text-color)
                {% elif action == 'cooling' %} var(--info-color)
                {% elif action in ['heating', 'defrosting'] %} var(--warning-color)
                {% elif action == 'idle' %} var(--success-color)
                {% else %} var(--secondary-text-color)
                {% endif %}
              entity: climate.living_room_klima
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    background: var(--card-background-color);
                    border-radius: 20px;
                    border: 1px solid var(--divider-color);
                  }
            - type: custom:decluttering-card
              template: plain_tile
              variables:
                - entity: sensor.grillplats_plug_power
                - label: AC Power
                - icon: mdi:flash
                - unit: " W"
            - type: custom:decluttering-card
              template: plain_tile
              variables:
                - entity: sensor.ac_session_energy
                - label: This Session
                - icon: mdi:lightning-bolt
                - unit: " kWh"

  # ---- Energy ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Grid Usage — Last 7 Days

  # NOTE: verify entity ID against Developer Tools → States.
  - type: statistics-graph
    chart_type: bar
    period: day
    title: Daily Grid Consumption
    entities:
      - entity: wnsm:at0010000000000000001000015255439
        name: Grid
    stat_types:
      - state
    days_to_show: 7

  # ---- Washing machine ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Washing Machine

  # NOTE: entity IDs say `waschemasche` (typo from integration setup).
  # Rename via Settings → Devices → entity → ⚙ → entity_id.
  - type: custom:decluttering-card
    template: status_tile_attr
    variables:
      - status_entity: sensor.washing_machine_status
      - label: Washing Machine

  - type: custom:decluttering-card
    template: plain_tile
    variables:
      - entity: sensor.waschemasche_remaining
      - label: Remaining
      - icon: mdi:timer-outline

  # ---- Smart plug ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Smart Plug

  - type: custom:decluttering-card
    template: smart_plug_block
    variables:
      - prefix: grillplats_plug
      - switch_entity: grillplats_plug_smart_plug
      - name: GRILLPLATS

  # ---- Devices ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Devices

  - type: horizontal-stack
    cards:
      - type: custom:decluttering-card
        template: status_tile
        variables:
          - entity: sensor.florians_iphone_battery_level
          - status_entity: sensor.flo_iphone_battery_status
          - label: Flo's iPhone
          - icon: mdi:cellphone
          - unit: "%"
      - type: custom:decluttering-card
        template: status_tile
        variables:
          - entity: sensor.hannis_phone_battery_level
          - status_entity: sensor.hanni_phone_battery_status
          - label: Hanni's Phone
          - icon: mdi:cellphone
          - unit: "%"

  - type: custom:decluttering-card
    template: status_tile_text
    variables:
      - status_entity: sensor.printer_ink_status
      - label: Printer Ink
      - icon: mdi:printer
      - secondary: "{{ states('sensor.printer_ink_display') }}"

  # ---- Shade automation ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Shade Automation

  - type: custom:mushroom-template-card
    primary: Resume Auto
    secondary: "{{ states('sensor.shade_override_summary') }}"
    icon: mdi:autorenew
    icon_color: >-
      {% if is_state('sensor.shade_override_active', 'moderate') %}
        var(--warning-color)
      {% else %}
        var(--success-color)
      {% endif %}
    tap_action:
      action: call-service
      service: script.resume_auto_blinds
    card_mod:
      style: |
        ha-card {
          background: var(--card-background-color);
          border-radius: 20px;
          border: 1px solid var(--divider-color);
        }

  - type: horizontal-stack
    cards:
      - type: custom:decluttering-card
        template: status_tile
        variables:
          - entity: sensor.wien_donaufeld_top_wind_speed
          - status_entity: sensor.wind_status
          - label: Wind Gust
          - icon: mdi:weather-windy
          - unit: " km/h"
      - type: custom:decluttering-card
        template: plain_tile
        variables:
          - entity: sensor.wien_donaufeld_temperature
          - label: Outside
          - icon: mdi:thermometer
          - unit: " °C"
      - type: custom:decluttering-card
        template: status_tile
        variables:
          - entity: sensor.wien_donaufeld_global_radiation
          - status_entity: sensor.solar_status
          - label: Solar
          - icon: mdi:white-balance-sunny
          - unit: " W/m²"


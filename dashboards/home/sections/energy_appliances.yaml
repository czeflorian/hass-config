# =============================================================================
#  Section: Energy + Appliances
#  Washing machine → Laundry dashboard.
#  GRILLPLATS plug → Climate dashboard.
#  Phones, shade automation → removed (on Climate dashboard).
# =============================================================================

type: grid
column_span: 2
cards:
  # ---- Running now (AC active) — only shown when on ----
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity: climate.living_room_klima
                state_not: "off"
              - condition: state
                entity: climate.living_room_klima
                state_not: "unavailable"
          - condition: state
            entity: switch.grillplats_plug
            state: "on"
    card:
      type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: section_title
          variables:
            - title: Running Now
        - type: horizontal-stack
          cards:
            - type: custom:mushroom-template-card
              primary: AC
              secondary: >
                {% set mode = states('climate.living_room_klima') %}
                {% set action = state_attr('climate.living_room_klima', 'hvac_action') %}
                {% set target = state_attr('climate.living_room_klima', 'temperature') %}
                {% if mode in ['off', 'unavailable'] %} Off
                {% else %} {{ action | title }} · {{ target }}°C
                {% endif %}
              icon: mdi:air-conditioner
              icon_color: >
                {% set mode = states('climate.living_room_klima') %}
                {% set action = state_attr('climate.living_room_klima', 'hvac_action') %}
                {% if mode in ['off', 'unavailable'] %} var(--disabled-text-color)
                {% elif action == 'cooling' %} var(--info-color)
                {% elif action in ['heating', 'defrosting'] %} var(--warning-color)
                {% elif action == 'idle' %} var(--success-color)
                {% else %} var(--secondary-text-color)
                {% endif %}
              entity: climate.living_room_klima
              tap_action:
                action: more-info
              card_mod:
                style: |
                  ha-card {
                    background: var(--card-background-color);
                    border-radius: 20px;
                    border: 1px solid var(--divider-color);
                  }
            - type: custom:decluttering-card
              template: plain_tile
              variables:
                - entity: sensor.grillplats_plug_power
                - label: AC Power
                - icon: mdi:flash
                - unit: " W"
            - type: custom:decluttering-card
              template: plain_tile
              variables:
                - entity: sensor.ac_session_energy
                - label: This Session
                - icon: mdi:lightning-bolt
                - unit: " kWh"

  # ---- Energy ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Grid Usage — Last 7 Days

  - type: statistics-graph
    chart_type: bar
    period: day
    title: Daily Grid Consumption
    entities:
      - entity: wnsm:at0010000000000000001000015255439
        name: Grid
    stat_types:
      - state
    days_to_show: 7

  # ---- Devices ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Devices

  - type: custom:decluttering-card
    template: status_tile_text
    variables:
      - status_entity: sensor.printer_ink_status
      - label: Printer Ink
      - icon: mdi:printer
      - secondary: "{{ states('sensor.printer_ink_display') }}"

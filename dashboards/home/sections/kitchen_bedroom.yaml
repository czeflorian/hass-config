# =============================================================================
#  Section: Kitchen + Bedroom
#  Individual lights → Lights dashboard. Bedroom shade → Climate dashboard.
# =============================================================================

type: grid
column_span: 1
cards:
  # ---- Kitchen (group only) ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Kitchen

  - type: custom:decluttering-card
    template: light_tile
    variables:
      - entity: light.kitchen_lights
      - name: Kitchen

  # ---- Bedroom (group only) ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Bedroom

  - type: custom:decluttering-card
    template: light_tile
    variables:
      - entity: light.bedroom_lights
      - name: Bedroom

  - type: custom:decluttering-card
    template: air_quality_block
    variables:
      - prefix: alpstuga_bedroom
      - prefix_clean: bedroom

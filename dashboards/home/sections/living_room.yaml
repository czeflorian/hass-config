# =============================================================================
#  Section: Living Room
#  Individual lights → Lights dashboard. Blinds → Climate dashboard.
# =============================================================================

type: grid
column_span: 1
cards:
  - type: custom:mushroom-title-card
    title: Welcome home 🌿
    subtitle: "{{ now().strftime('%A, %d %B %Y') }}"

  - type: horizontal-stack
    cards:
      - type: custom:mushroom-person-card
        entity: person.flo
        name: Flo
        show_state: true
      - type: custom:mushroom-person-card
        entity: person.hanni
        name: Hanni
        show_state: true

  - type: weather-forecast
    entity: weather.forecast_home
    forecast_type: daily

  # ---- Lights (group only) ----
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Living Room

  - type: custom:decluttering-card
    template: light_tile
    variables:
      - entity: light.living_room_lights
      - name: Living Room

  # ---- Air quality ----
  - type: custom:decluttering-card
    template: air_quality_block
    variables:
      - prefix: alpstuga_living_room
      - prefix_clean: living_room

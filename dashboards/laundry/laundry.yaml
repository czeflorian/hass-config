# =============================================================================
#  Laundry Dashboard
#  Full washing machine controls and status.
# =============================================================================

decluttering_templates: !include ../home/decluttering_templates.yaml

title: Laundry
views:
  - title: Laundry
    path: laundry
    icon: mdi:washing-machine
    type: sections
    max_columns: 2
    sections:
      # ---- Status --------------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: custom:decluttering-card
            template: section_title
            variables:
              - title: Status

          - type: custom:decluttering-card
            template: status_tile_attr
            variables:
              - status_entity: sensor.washing_machine_status
              - label: Washing Machine

          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.waschemasche_programme
                  - label: Programme
                  - icon: mdi:tshirt-crew
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.waschemasche_remaining
                  - label: Remaining
                  - icon: mdi:timer-outline

          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.waschemasche_programme_end_time
                  - label: Ends at
                  - icon: mdi:clock-end
              - type: custom:decluttering-card
                template: status_tile
                variables:
                  - entity: binary_sensor.waschemasche_door_is_open
                  - status_entity: sensor.washing_machine_door_status
                  - label: Door
                  - icon: mdi:door

          - type: horizontal-stack
            cards:
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.waschemasche_temperature
                  - label: Temperature
                  - icon: mdi:thermometer-water
              - type: custom:decluttering-card
                template: plain_tile
                variables:
                  - entity: sensor.waschemasche_spin
                  - label: Spin
                  - icon: mdi:rotate-3d-variant

      # ---- Controls -----------------------------------------------------------
      - type: grid
        column_span: 1
        cards:
          - type: custom:decluttering-card
            template: section_title
            variables:
              - title: Controls

          # Power on/off via state select (no dedicated power switch entity)
          - type: custom:mushroom-select-card
            entity: select.waschemasche_state
            name: Power
            icon: mdi:power
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          - type: custom:mushroom-select-card
            entity: select.waschemasche_programme
            name: Programme
            icon: mdi:washing-machine
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          - type: horizontal-stack
            cards:
              - type: custom:mushroom-select-card
                entity: select.waschemasche_temperature
                name: Temp
                icon: mdi:thermometer-water
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }

              - type: custom:mushroom-select-card
                entity: select.waschemasche_spin
                name: Spin
                icon: mdi:rotate-3d-variant
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }
          - type: horizontal-stack
            cards:

              - type: custom:mushroom-select-card
                entity: select.waschemasche_fast
                name: Fast+
                icon: mdi:fast-forward
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }
              - type: custom:mushroom-select-card
                entity: select.waschemasche_drying
                name: Drying
                icon: mdi:tumble-dryer
                card_mod:
                  style: |
                    ha-card {
                      background: var(--card-background-color);
                      border-radius: 20px;
                      border: 1px solid var(--divider-color);
                    }
          - type: custom:mushroom-entity-card
            entity: switch.waschemasche_extra_rinse
            name: Extra Rinse
            icon: mdi:water-plus
            tap_action:
              action: toggle
            card_mod:
              style: |
                ha-card {
                  background: var(--card-background-color);
                  border-radius: 20px;
                  border: 1px solid var(--divider-color);
                }

          



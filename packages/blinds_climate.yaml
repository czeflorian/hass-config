# =============================================================================
#  Blinds + climate control — sensors & scripts
#
#  Automations live in automations/blinds_climate.yaml.
#
#  Manual-override flags are defined in packages/shade_automation.yaml:
#    - input_boolean.shades_manual_override_bedroom
#    - input_boolean.shades_manual_override_living_room
# =============================================================================

# -----------------------------------------------------------------------------
# Decision sensors — threshold platform
# Yields: binary_sensor.wind_unsafe, binary_sensor.radiation_high
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: threshold
    name: "Wind Unsafe"
    entity_id: sensor.wien_donaufeld_top_wind_speed
    upper: 35
    hysteresis: 5   # on at ~40 km/h, off at ~30 km/h

  - platform: threshold
    name: "Radiation High"
    entity_id: sensor.wien_donaufeld_global_radiation
    upper: 210
    hysteresis: 40  # on at ~250 W/m², off at ~170 W/m²

# -----------------------------------------------------------------------------
# Dashboard status sensors — drive the wind + solar tiles
# -----------------------------------------------------------------------------
template:
  - sensor:
      - name: "Wind Status"
        unique_id: wind_status
        state: >
          {% if is_state('binary_sensor.wind_unsafe', 'on') %} poor
          {% elif states('sensor.wien_donaufeld_top_wind_speed') in ['unknown', 'unavailable'] %} unavailable
          {% else %} good
          {% endif %}

      - name: "Solar Status"
        unique_id: solar_status
        state: >
          {% if is_state('binary_sensor.radiation_high', 'on') %} moderate
          {% elif states('sensor.wien_donaufeld_global_radiation') in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %} good
          {% endif %}

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  resume_auto_blinds:
    alias: Resume auto blinds
    icon: mdi:autorenew
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.shades_manual_override_bedroom
            - input_boolean.shades_manual_override_living_room

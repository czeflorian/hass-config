# =============================================================================
#  Shade automation helpers
#
#  Manual-override flags are shared with the blinds + climate automations
#  (packages/blinds_climate.yaml). Clearing them via script.resume_auto_blinds
#  hands control back to the auto-shading automations.
# =============================================================================

input_boolean:
  shades_manual_override_living_room:
    name: Living Room shades — manual override
    icon: mdi:hand-back-right
    initial: false

  shades_manual_override_bedroom:
    name: Bedroom shades — manual override
    icon: mdi:hand-back-right
    initial: false

# =============================================================================
#  Status sensors for dashboard tiles
# =============================================================================
template:
  - sensor:
      # ---- Override summary (for dashboard reset tile) ----
      - name: "Shade Override Summary"
        unique_id: shade_override_summary
        state: >
          {% set lr = is_state('input_boolean.shades_manual_override_living_room', 'on') %}
          {% set br = is_state('input_boolean.shades_manual_override_bedroom', 'on') %}
          {% if lr and br %} Both rooms overridden
          {% elif lr %} Living Room overridden
          {% elif br %} Bedroom overridden
          {% else %} Nothing to reset
          {% endif %}

      # ---- Washing machine status ----
      - name: "Washing Machine Status"
        unique_id: washing_machine_status
        state: >
          {% set s = states('sensor.waschemasche_state') %}
          {% if s == 'run' %} active
          {% elif s == 'end' %} good
          {% elif s == 'pause' %} moderate
          {% elif s in ['unavailable', 'unknown', 'none'] %} unavailable
          {% else %} idle
          {% endif %}
        attributes:
          text: >
            {% set s = states('sensor.waschemasche_state') %}
            {% if s == 'run' %}
              Running — {{ states('sensor.waschemasche_programme') }} — {{ states('sensor.waschemasche_remaining') }} left
            {% elif s == 'end' %} Done — please unload
            {% elif s == 'pause' %} Paused
            {% elif s in ['unavailable', 'unknown', 'none'] %} Offline
            {% else %} Ready
            {% endif %}
          icon: >
            {% set s = states('sensor.waschemasche_state') %}
            {% if s == 'run' %} mdi:washing-machine
            {% elif s == 'end' %} mdi:check-circle
            {% elif s == 'pause' %} mdi:pause-circle
            {% elif s in ['unavailable', 'unknown', 'none'] %} mdi:help-circle-outline
            {% else %} mdi:washing-machine-off
            {% endif %}

      # ---- Washing machine door ----
      - name: "Washing Machine Door Status"
        unique_id: washing_machine_door_status
        state: >
          {% if is_state('binary_sensor.waschemasche_door_is_open', 'on') %} moderate
          {% else %} good
          {% endif %}

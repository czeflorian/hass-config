# =============================================================================
#  Air Quality template sensors
#  Loaded via packages: !include_dir_named packages in configuration.yaml
#
#  These sensors do all the threshold logic ONCE so the dashboard can just
#  read the result. Add a new room by copying one block and changing the
#  source entity prefix.
# =============================================================================

template:
  - sensor:
      # ---- Living Room ----
      - name: "Living Room AQI Status"
        unique_id: living_room_aqi_status
        state: >
          {% set v = states('sensor.alpstuga_living_room_pm2_5') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | float %}
            {% if v <= 9.0 %} good
            {% elif v <= 35.4 %} moderate
            {% elif v <= 55.4 %} poor
            {% else %} hazardous
            {% endif %}
          {% endif %}
        availability: >
          {{ states('sensor.alpstuga_living_room_pm2_5') not in ['unknown', 'unavailable'] }}

      - name: "Living Room CO2 Status"
        unique_id: living_room_co2_status
        state: >
          {% set v = states('sensor.alpstuga_living_room_carbon_dioxide') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | int %}
            {% if v < 800 %} good
            {% elif v < 1200 %} moderate
            {% else %} poor
            {% endif %}
          {% endif %}

      - name: "Living Room Humidity Status"
        unique_id: living_room_humidity_status
        state: >
          {% set v = states('sensor.alpstuga_living_room_humidity') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | float %}
            {% if v >= 40 and v <= 60 %} good
            {% elif v >= 30 and v <= 70 %} moderate
            {% else %} poor
            {% endif %}
          {% endif %}

      # ---- Bedroom ----
      - name: "Bedroom AQI Status"
        unique_id: bedroom_aqi_status
        state: >
          {% set v = states('sensor.alpstuga_bedroom_pm2_5') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | float %}
            {% if v <= 9.0 %} good
            {% elif v <= 35.4 %} moderate
            {% elif v <= 55.4 %} poor
            {% else %} hazardous
            {% endif %}
          {% endif %}

      - name: "Bedroom CO2 Status"
        unique_id: bedroom_co2_status
        state: >
          {% set v = states('sensor.alpstuga_bedroom_carbon_dioxide') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | int %}
            {% if v < 800 %} good
            {% elif v < 1200 %} moderate
            {% else %} poor
            {% endif %}
          {% endif %}

      - name: "Bedroom Humidity Status"
        unique_id: bedroom_humidity_status
        state: >
          {% set v = states('sensor.alpstuga_bedroom_humidity') %}
          {% if v in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set v = v | float %}
            {% if v >= 40 and v <= 60 %} good
            {% elif v >= 30 and v <= 70 %} moderate
            {% else %} poor
            {% endif %}
          {% endif %}

      # ---- Battery status helpers ----
      - name: "Flo iPhone Battery Status"
        unique_id: flo_iphone_battery_status
        state: >
          {% set b = states('sensor.florians_iphone_battery_level') %}
          {% if b in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set b = b | int %}
            {% if b > 50 %} good
            {% elif b > 20 %} moderate
            {% else %} low
            {% endif %}
          {% endif %}

      - name: "Hanni Phone Battery Status"
        unique_id: hanni_phone_battery_status
        state: >
          {% set b = states('sensor.hannis_phone_battery_level') %}
          {% if b in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set b = b | int %}
            {% if b > 50 %} good
            {% elif b > 20 %} moderate
            {% else %} low
            {% endif %}
          {% endif %}

      - name: "Printer Ink Status"
        unique_id: printer_ink_status
        state: >
          {% set b = states('sensor.hp_envy_6000_series_black_cartridge') %}
          {% set c = states('sensor.hp_envy_6000_series_tri_color_cartridge') %}
          {% if b in ['unknown', 'unavailable', 'none'] or c in ['unknown', 'unavailable', 'none'] %}
            unavailable
          {% else %}
            {% set b = b | int %}
            {% set c = c | int %}
            {% if b < 15 or c < 15 %} low
            {% elif b < 30 or c < 30 %} moderate
            {% else %} good
            {% endif %}
          {% endif %}

      # ---- GRILLPLATS plug ----
      # Maps the plug to standard status vocabulary plus a human-readable text
      # attribute. State values: active (drawing power), moderate (standby),
      # idle (off), unavailable.
      - name: "GRILLPLATS Plug Activity"
        unique_id: grillplats_plug_activity
        state: >
          {% set p = states('sensor.grillplats_plug_power') %}
          {% if p in ['unknown', 'unavailable', 'none'] %} unavailable
          {% else %}
            {% set p = p | float %}
            {% if p < 0.5 %} idle
            {% elif p < 5.0 %} moderate
            {% else %} active
            {% endif %}
          {% endif %}
        attributes:
          text: >
            {% set s = states('sensor.grillplats_plug_power') %}
            {% if s in ['unknown', 'unavailable', 'none'] %} Offline
            {% else %}
              {% set p = s | float %}
              {% if p < 0.5 %} Off
              {% elif p < 5.0 %} Standby ({{ s }} W)
              {% else %} Active — {{ s }} W
              {% endif %}
            {% endif %}

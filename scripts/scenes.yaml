# ---- Movie Mode -------------------------------------------------------------
# Behavior:
#   - If sun is below horizon (dark out):
#       Living room lights as dim + warm as they go; floor lamp to 50%
#       brightness as warm as it goes; kitchen off.
#   - If sun is above horizon (light out):
#       Living room shades close, all kitchen + living room lights off.
# Revert: double press on BILRESA LR button 2 (movie/TV button) restores
# living room lights + floor lamp to normal (see remote_bilresa.yaml). Kitchen
# is deliberately left off — revert means "back to work", not "go to kitchen".
movie_mode:
  alias: Movie Mode
  description: >
    Dim everything for evening viewing, or close shades and kill lights for
    daytime viewing. Triggered by BILRESA LR button 2 or directly from the UI.
  mode: single
  icon: mdi:movie-open
  sequence:
    - choose:
        # ---- Dark out: dim warm, kitchen off ----
        - conditions:
            - condition: state
              entity_id: sun.sun
              state: below_horizon
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.living_room_lights
              data:
                brightness_pct: 1
                color_temp_kelvin: "{{ state_attr('light.living_room_lights', 'min_color_temp_kelvin') }}"
                transition: 2
            - action: light.turn_on
              target:
                entity_id: light.floor_lamp
              data:
                brightness_pct: 50
                color_temp_kelvin: "{{ state_attr('light.floor_lamp', 'min_color_temp_kelvin') }}"
                transition: 2
            - action: light.turn_off
              target:
                entity_id: light.kitchen_lights
              data:
                transition: 2

        # ---- Light out: close shades, lights off ----
        - conditions:
            - condition: state
              entity_id: sun.sun
              state: above_horizon
          sequence:
            - action: cover.close_cover
              target:
                entity_id: cover.living_room_left
            - delay: "00:00:01"
            - action: cover.close_cover
              target:
                entity_id: cover.living_room_right
            - action: light.turn_off
              target:
                entity_id:
                  - light.living_room_lights
                  - light.kitchen_lights
                  - light.floor_lamp
              data:
                transition: 2

# ─────────────────────────────────────────────────────
# Misty Forest — comprehensive
#
# Place in: /config/themes/misty_forest.yaml
# Enable in configuration.yaml:
#   frontend:
#     themes: !include_dir_merge_named themes/
#
# Design notes:
#   - Named colors (mush-rgb-blue, etc.) keep their Material Design defaults.
#     Don't redefine what "blue" means — that's confusing.
#   - State mappings (mush-rgb-state-cover-open, etc.) get overridden to use
#     warm palette colors. That's the documented theming surface.
#   - YAML anchors at the top — change a hex once, propagates everywhere.
# ─────────────────────────────────────────────────────

Misty Forest:

  # ═══════════════════════════════════════════════════
  # PALETTE — light mode
  # ═══════════════════════════════════════════════════
  forest-floor-light: &ff_l "#e8f0e4"           # main bg
  moss-card-light:    &mc_l "#f0f5ee"           # cards
  fern-light:         &fern_l "#4a7c59"         # primary green
  fern-mid-light:     &fern_mid_l "#7aaa88"     # lighter green
  fern-deep-light:    &fern_deep_l "#2e5c3a"    # darker green
  ember-light:        &ember_l "#d47a3a"        # accent / warning
  dew-light:          &dew_l "#d4e8cc"          # divider
  bark-light:         &bark_l "#6b7c65"         # secondary text
  canopy-light:       &canopy_l "#1c2e1e"       # primary text
  disabled-light:     &dis_l "#a8bca2"
  error-light:        &err_l "#b04040"
  amber-light:        &amber_l "#c4961e"

  # ═══════════════════════════════════════════════════
  # PALETTE — dark mode
  # ═══════════════════════════════════════════════════
  midnight-grove:     &ff_d "#141f15"
  deep-moss:          &mc_d "#1c2b1e"
  fern-dark:          &fern_d "#7aaa88"
  fern-mid-dark:      &fern_mid_d "#a3c96e"
  fern-deep-dark:     &fern_deep_d "#4a7c59"
  ember-dark:         &ember_d "#d47a3a"
  shadow-dew:         &dew_d "#2a3d2c"
  pale-bark:          &bark_d "#8fa887"
  mist:               &canopy_d "#ddecd5"
  disabled-dark:      &dis_d "#4a5e4c"
  error-dark:         &err_d "#c06060"
  amber-dark:         &amber_d "#d4a832"

  modes:

    # ═══════════════════════════════════════════════════
    #                 LIGHT MODE
    # ═══════════════════════════════════════════════════
    light:
      # ── Backgrounds ──
      primary-background-color: *ff_l
      secondary-background-color: *mc_l
      card-background-color: *mc_l
      divider-color: *dew_l

      # ── Sidebar ──
      sidebar-background-color: *fern_l
      sidebar-text-color: *mc_l
      sidebar-icon-color: "#c2e0c8"
      sidebar-selected-text-color: "#ffffff"
      sidebar-selected-icon-color: "#ffffff"
      sidebar-selected-background-color: *fern_deep_l
      sidebar-border-color: *fern_deep_l

      # ── Header / Toolbar ──
      app-header-background-color: *fern_l
      app-header-text-color: *mc_l
      app-header-selection-bar-color: *ember_l
      app-header-edit-background-color: *fern_deep_l
      app-toolbar-text-color: *mc_l

      # ── Primary & accent ──
      primary-color: *fern_l
      accent-color: *ember_l
      light-primary-color: *fern_mid_l
      dark-primary-color: *fern_deep_l

      # ── RGB forms (used by HA core for rgba() overlays) ──
      rgb-primary-color: "74, 124, 89"
      rgb-accent-color: "212, 122, 58"
      rgb-primary-text-color: "28, 46, 30"
      rgb-secondary-text-color: "107, 124, 101"
      rgb-text-primary-color: "28, 46, 30"
      rgb-card-background-color: "240, 245, 238"
      rgb-state-icon-color: "74, 124, 89"

      # ── Text ──
      primary-text-color: *canopy_l
      secondary-text-color: *bark_l
      text-primary-color: *canopy_l
      disabled-text-color: *dis_l
      text-accent-color: *ember_l
      label-badge-background-color: *ember_l
      label-badge-text-color: "#ffffff"

      # ── Switches & toggles ──
      switch-checked-color: *fern_l
      switch-checked-button-color: "#ffffff"
      switch-checked-track-color: *fern_mid_l
      switch-unchecked-color: *dis_l
      switch-unchecked-button-color: "#ffffff"
      switch-unchecked-track-color: *dew_l

      # ── Sliders ──
      slider-color: *fern_l
      slider-secondary-color: *dew_l
      slider-bar-color: *dew_l
      paper-slider-knob-color: *fern_l
      paper-slider-knob-start-color: *fern_l
      paper-slider-pin-color: *fern_l
      paper-slider-active-color: *fern_l
      paper-slider-container-color: *dew_l

      # ── Cards ──
      ha-card-background: *mc_l
      ha-card-border-color: *dew_l
      ha-card-border-width: "1px"
      ha-card-border-radius: "20px"
      ha-card-box-shadow: "0 2px 12px rgba(28,46,30,0.07)"
      ha-card-header-color: *canopy_l

      # ── Inputs ──
      input-background-color: *ff_l
      input-fill-color: *ff_l
      input-ink-color: *canopy_l
      input-label-ink-color: *bark_l
      input-idle-line-color: *dew_l
      input-hover-line-color: *fern_l
      input-focused-color: *fern_l
      input-focused-label-color: *fern_l
      input-focused-line-color: *fern_l
      input-disabled-fill-color: *mc_l
      input-disabled-ink-color: *dis_l
      input-dropdown-icon-color: *bark_l

      # ── Material Design Components (MDC) ──
      # Covers ha-button, ha-dropdown-item, ha-select, mwc-list-item,
      # checkboxes, radios, tabs, dialogs etc. Without these, MDC components
      # default to Material Blue (#6200ee or similar). Many of HA's settings
      # menus and dialogs render via these components.
      mdc-theme-primary: *fern_l
      mdc-theme-secondary: *ember_l
      mdc-theme-on-primary: "#ffffff"
      mdc-theme-on-secondary: "#ffffff"
      mdc-theme-surface: *mc_l
      mdc-theme-on-surface: *canopy_l
      mdc-theme-background: *ff_l
      mdc-theme-error: *err_l
      mdc-theme-text-primary-on-background: *canopy_l
      mdc-theme-text-secondary-on-background: *bark_l
      mdc-theme-text-hint-on-background: *bark_l
      mdc-theme-text-disabled-on-background: *dis_l
      mdc-theme-text-icon-on-background: *bark_l

      # Buttons (ha-button, mwc-button)
      mdc-button-disabled-fill-color: *dew_l
      mdc-button-outline-color: *fern_l

      # List items (ha-dropdown-item, mwc-list-item)
      mdc-list-item-graphic-margin: 16px
      mdc-list-item-meta-size: 24px

      # Select / dropdown
      mdc-select-fill-color: *ff_l
      mdc-select-ink-color: *canopy_l
      mdc-select-label-ink-color: *bark_l
      mdc-select-idle-line-color: *dew_l
      mdc-select-hover-line-color: *fern_l
      mdc-select-focused-dropdown-icon-color: *fern_l
      mdc-select-dropdown-icon-color: *bark_l

      # Checkbox / radio
      mdc-checkbox-unchecked-color: *bark_l
      mdc-checkbox-disabled-color: *dis_l
      mdc-radio-unchecked-color: *bark_l
      mdc-radio-disabled-color: *dis_l

      # Tabs (settings menus, multi-pane dialogs)
      mdc-tab-color-default: *bark_l
      mdc-tab-text-label-color-default: *bark_l

      # Ripples (touch feedback) — use primary green at low opacity
      mdc-ripple-color: *fern_l

      # Paper / legacy components still used in some places
      paper-item-icon-color: *bark_l
      paper-item-icon-active-color: *fern_l

      # ── States (semantic) ──
      success-color: *fern_l
      warning-color: *ember_l
      error-color: *err_l
      info-color: *fern_mid_l

      # ── Per-domain state colors (HA core variables) ──
      state-icon-color: *fern_l
      state-icon-active-color: *ember_l
      state-icon-unavailable-color: *dis_l
      state-light-active-color: *ember_l
      state-switch-active-color: *fern_l
      state-binary_sensor-active-color: *fern_l
      state-cover-active-color: *fern_l
      state-fan-active-color: *fern_l
      state-climate-heating-color: *ember_l
      state-climate-cooling-color: *fern_mid_l
      state-climate-drying-color: *amber_l
      state-climate-idle-color: *dis_l
      state-media_player-active-color: *fern_l
      state-vacuum-active-color: *fern_l
      state-person-home-color: *fern_l
      state-person-not_home-color: *bark_l
      state-update-installing-color: *amber_l

      # ── History graph colors ──
      history-fill-color: *fern_l
      history-line-color: *fern_l
      state-history-fill-color: *fern_l
      state-history-line-color: *fern_l
      state-on-color: *fern_l
      state-off-color: *dis_l
      state-unavailable-color: *dew_l

      # ── Multi-series chart palette ──
      graph-color-1: *fern_l
      graph-color-2: *ember_l
      graph-color-3: *amber_l
      graph-color-4: *fern_deep_l
      graph-color-5: *bark_l
      graph-color-6: *err_l
      graph-color-7: *fern_mid_l
      graph-color-8: *canopy_l

      # ── Energy dashboard ──
      energy-grid-consumption-color: *ember_l       # what you draw
      energy-grid-return-color: *fern_l             # what you push back
      energy-solar-color: *amber_l                  # solar production
      energy-battery-in-color: *fern_deep_l
      energy-battery-out-color: *fern_mid_l
      energy-non-fossil-color: *fern_l
      energy-gas-color: *err_l
      energy-water-color: *fern_mid_l

      # ── Mushroom — keep named colors at their Material Design defaults ──
      # We DON'T override mush-rgb-red/blue/green/etc. These are the named
      # color slots — if a card says `icon_color: blue`, it should be blue.
      # We override only the STATE mappings below to point those slots at
      # whichever named color we want for that state.

      # Mushroom state mappings — point each state at our preferred named color.
      # Syntax: state slot → reference a named color via its CSS var.
      mush-rgb-state-fan: "var(--rgb-primary-color)"        # fern green
      mush-rgb-state-light: "var(--mush-rgb-orange)"        # warm light glow
      mush-rgb-state-entity: "var(--rgb-primary-color)"     # fern (was blue)
      mush-rgb-state-switch: "var(--rgb-primary-color)"     # fern (was blue)

      mush-rgb-state-cover-open: "var(--rgb-primary-color)" # fern (was blue)
      mush-rgb-state-cover-closed: "var(--mush-rgb-disabled)"

      mush-rgb-state-person-home: "var(--rgb-primary-color)"
      mush-rgb-state-person-not-home: "var(--mush-rgb-red)"
      mush-rgb-state-person-zone: "var(--rgb-accent-color)"
      mush-rgb-state-person-unknown: "var(--mush-rgb-grey)"

      mush-rgb-state-alarm-disarmed: "var(--rgb-primary-color)"
      mush-rgb-state-alarm-armed: "var(--mush-rgb-orange)"
      mush-rgb-state-alarm-triggered: "var(--mush-rgb-red)"

      # Climate: keep semantic intuition (heat=warm, cool=green, off=grey)
      mush-rgb-state-climate-heat: "var(--mush-rgb-deep-orange)"
      mush-rgb-state-climate-cool: "var(--rgb-primary-color)"
      mush-rgb-state-climate-auto: "var(--rgb-primary-color)"
      mush-rgb-state-climate-heat-cool: "var(--rgb-primary-color)"
      mush-rgb-state-climate-dry: "var(--mush-rgb-amber)"
      mush-rgb-state-climate-fan-only: "var(--mush-rgb-grey)"
      mush-rgb-state-climate-idle: "var(--mush-rgb-grey)"
      mush-rgb-state-climate-off: "var(--mush-rgb-disabled)"

      # Mushroom also uses these semantic slots
      mush-rgb-info: "var(--rgb-primary-color)"
      mush-rgb-success: "var(--mush-rgb-green)"
      mush-rgb-warning: "var(--mush-rgb-orange)"
      mush-rgb-danger: "var(--mush-rgb-red)"

      mush-rgb-disabled: "189, 189, 189"

    # ═══════════════════════════════════════════════════
    #                 DARK MODE
    # ═══════════════════════════════════════════════════
    dark:
      # ── Backgrounds ──
      primary-background-color: *ff_d
      secondary-background-color: *mc_d
      card-background-color: *mc_d
      divider-color: *dew_d

      # ── Sidebar ──
      sidebar-background-color: *fern_deep_d
      sidebar-text-color: "#f0f5ee"
      sidebar-icon-color: "#c2e0c8"
      sidebar-selected-text-color: "#ffffff"
      sidebar-selected-icon-color: *canopy_d
      sidebar-selected-background-color: "#3a6447"
      sidebar-border-color: "#3a6447"

      # ── Header / Toolbar ──
      app-header-background-color: *fern_deep_d
      app-header-text-color: "#f0f5ee"
      app-header-selection-bar-color: *ember_d
      app-header-edit-background-color: "#3a6447"
      app-toolbar-text-color: "#f0f5ee"

      # ── Primary & accent ──
      primary-color: *fern_d
      accent-color: *ember_d
      light-primary-color: *fern_mid_d
      dark-primary-color: *fern_deep_d

      # ── RGB forms ──
      rgb-primary-color: "122, 170, 136"
      rgb-accent-color: "212, 122, 58"
      rgb-primary-text-color: "221, 236, 213"
      rgb-secondary-text-color: "143, 168, 135"
      rgb-text-primary-color: "221, 236, 213"
      rgb-card-background-color: "28, 43, 30"
      rgb-state-icon-color: "122, 170, 136"

      # ── Text ──
      primary-text-color: *canopy_d
      secondary-text-color: *bark_d
      text-primary-color: *canopy_d
      disabled-text-color: *dis_d
      text-accent-color: *ember_d
      label-badge-background-color: *ember_d
      label-badge-text-color: "#ffffff"

      # ── Switches & toggles ──
      switch-checked-color: *fern_d
      switch-checked-button-color: *mc_d
      switch-checked-track-color: *fern_deep_d
      switch-unchecked-color: *dis_d
      switch-unchecked-button-color: *bark_d
      switch-unchecked-track-color: *dew_d

      # ── Sliders ──
      slider-color: *fern_d
      slider-secondary-color: *dew_d
      slider-bar-color: *dew_d
      paper-slider-knob-color: *fern_d
      paper-slider-knob-start-color: *fern_d
      paper-slider-pin-color: *fern_d
      paper-slider-active-color: *fern_d
      paper-slider-container-color: *dew_d

      # ── Cards ──
      ha-card-background: *mc_d
      ha-card-border-color: *dew_d
      ha-card-border-width: "1px"
      ha-card-border-radius: "20px"
      ha-card-box-shadow: "0 2px 16px rgba(0,0,0,0.3)"
      ha-card-header-color: *canopy_d

      # ── Inputs ──
      input-background-color: *mc_d
      input-fill-color: *mc_d
      input-ink-color: *canopy_d
      input-label-ink-color: *bark_d
      input-idle-line-color: *dew_d
      input-hover-line-color: *fern_d
      input-focused-color: *fern_d
      input-focused-label-color: *fern_d
      input-focused-line-color: *fern_d
      input-disabled-fill-color: *ff_d
      input-disabled-ink-color: *dis_d
      input-dropdown-icon-color: *bark_d

      # ── Material Design Components (MDC) ──
      mdc-theme-primary: *fern_d
      mdc-theme-secondary: *ember_d
      mdc-theme-on-primary: *mc_d
      mdc-theme-on-secondary: "#ffffff"
      mdc-theme-surface: *mc_d
      mdc-theme-on-surface: *canopy_d
      mdc-theme-background: *ff_d
      mdc-theme-error: *err_d
      mdc-theme-text-primary-on-background: *canopy_d
      mdc-theme-text-secondary-on-background: *bark_d
      mdc-theme-text-hint-on-background: *bark_d
      mdc-theme-text-disabled-on-background: *dis_d
      mdc-theme-text-icon-on-background: *bark_d

      # Buttons
      mdc-button-disabled-fill-color: *dew_d
      mdc-button-outline-color: *fern_d

      # List items
      mdc-list-item-graphic-margin: 16px
      mdc-list-item-meta-size: 24px

      # Select / dropdown
      mdc-select-fill-color: *mc_d
      mdc-select-ink-color: *canopy_d
      mdc-select-label-ink-color: *bark_d
      mdc-select-idle-line-color: *dew_d
      mdc-select-hover-line-color: *fern_d
      mdc-select-focused-dropdown-icon-color: *fern_d
      mdc-select-dropdown-icon-color: *bark_d

      # Checkbox / radio
      mdc-checkbox-unchecked-color: *bark_d
      mdc-checkbox-disabled-color: *dis_d
      mdc-radio-unchecked-color: *bark_d
      mdc-radio-disabled-color: *dis_d

      # Tabs
      mdc-tab-color-default: *bark_d
      mdc-tab-text-label-color-default: *bark_d

      # Ripples
      mdc-ripple-color: *fern_d

      # Paper / legacy
      paper-item-icon-color: *bark_d
      paper-item-icon-active-color: *fern_d

      # ── States (semantic) ──
      success-color: *fern_d
      warning-color: *ember_d
      error-color: *err_d
      info-color: *fern_mid_d

      # ── Per-domain state colors (HA core variables) ──
      state-icon-color: *fern_d
      state-icon-active-color: *ember_d
      state-icon-unavailable-color: *dis_d
      state-light-active-color: *ember_d
      state-switch-active-color: *fern_d
      state-binary_sensor-active-color: *fern_d
      state-cover-active-color: *fern_d
      state-fan-active-color: *fern_d
      state-climate-heating-color: *ember_d
      state-climate-cooling-color: *fern_mid_d
      state-climate-drying-color: *amber_d
      state-climate-idle-color: *dis_d
      state-media_player-active-color: *fern_d
      state-vacuum-active-color: *fern_d
      state-person-home-color: *fern_d
      state-person-not_home-color: *bark_d
      state-update-installing-color: *amber_d

      # ── History graph colors ──
      history-fill-color: *fern_d
      history-line-color: *fern_d
      state-history-fill-color: *fern_d
      state-history-line-color: *fern_d
      state-on-color: *fern_d
      state-off-color: *dis_d
      state-unavailable-color: *dew_d

      # ── Multi-series chart palette ──
      graph-color-1: *fern_d
      graph-color-2: *ember_d
      graph-color-3: *amber_d
      graph-color-4: *fern_deep_d
      graph-color-5: *bark_d
      graph-color-6: *err_d
      graph-color-7: *fern_mid_d
      graph-color-8: *canopy_d

      # ── Energy dashboard ──
      energy-grid-consumption-color: *ember_d
      energy-grid-return-color: *fern_d
      energy-solar-color: *amber_d
      energy-battery-in-color: *fern_deep_d
      energy-battery-out-color: *fern_mid_d
      energy-non-fossil-color: *fern_d
      energy-gas-color: *err_d
      energy-water-color: *fern_mid_d

      # ── Mushroom state mappings ──
      mush-rgb-state-fan: "var(--rgb-primary-color)"
      mush-rgb-state-light: "var(--mush-rgb-orange)"
      mush-rgb-state-entity: "var(--rgb-primary-color)"
      mush-rgb-state-switch: "var(--rgb-primary-color)"

      mush-rgb-state-cover-open: "var(--rgb-primary-color)"
      mush-rgb-state-cover-closed: "var(--mush-rgb-disabled)"

      mush-rgb-state-person-home: "var(--rgb-primary-color)"
      mush-rgb-state-person-not-home: "var(--mush-rgb-red)"
      mush-rgb-state-person-zone: "var(--rgb-accent-color)"
      mush-rgb-state-person-unknown: "var(--mush-rgb-grey)"

      mush-rgb-state-alarm-disarmed: "var(--rgb-primary-color)"
      mush-rgb-state-alarm-armed: "var(--mush-rgb-orange)"
      mush-rgb-state-alarm-triggered: "var(--mush-rgb-red)"

      mush-rgb-state-climate-heat: "var(--mush-rgb-deep-orange)"
      mush-rgb-state-climate-cool: "var(--rgb-primary-color)"
      mush-rgb-state-climate-auto: "var(--rgb-primary-color)"
      mush-rgb-state-climate-heat-cool: "var(--rgb-primary-color)"
      mush-rgb-state-climate-dry: "var(--mush-rgb-amber)"
      mush-rgb-state-climate-fan-only: "var(--mush-rgb-grey)"
      mush-rgb-state-climate-idle: "var(--mush-rgb-grey)"
      mush-rgb-state-climate-off: "var(--mush-rgb-disabled)"

      mush-rgb-info: "var(--rgb-primary-color)"
      mush-rgb-success: "var(--mush-rgb-green)"
      mush-rgb-warning: "var(--mush-rgb-orange)"
      mush-rgb-danger: "var(--mush-rgb-red)"

      mush-rgb-disabled: "111, 111, 111"